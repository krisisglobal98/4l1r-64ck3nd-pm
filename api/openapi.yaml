openapi: 3.1.0
info:
  title: ALIR Portal Master service
  version: 0.1.0
  description: >
    Masters of Portal Master. Every request is checked against the caller's access on the master's menu
    (may(user, menu, action), ALIR docs/auth-api.md). Until the Authentication service issues tokens the
    service acts as PM_DEFAULT_USER with full access. Every response carries X-Request-ID.
servers:
  - url: http://localhost:8081
paths:
  /healthz:
    get: { summary: Process is up, responses: { '200': { description: ok } } }
  /readyz:
    get: { summary: Database reachable, responses: { '200': { description: ready }, '503': { description: database unavailable } } }
  /pm/masters/levels:
    get:
      summary: List organization levels, by rank (pm.orgLevel read)
      responses:
        '200': { description: Levels, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Level' } } } } }
    post:
      summary: Add a level (pm.orgLevel create)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LevelInput' } } } }
      responses:
        '201': { description: Stored level, content: { application/json: { schema: { $ref: '#/components/schemas/Level' } } } }
        '422': { $ref: '#/components/responses/Validation' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { description: 'NO_PREFIX: no active row in pm.code_prefix for org_level', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /pm/masters/levels/upload:
    post:
      summary: CSV import (pm.orgLevel upload); not available yet
      responses: { '501': { $ref: '#/components/responses/Error' } }
  /pm/masters/levels/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string }, description: Any case }
    get:
      summary: One level
      responses:
        '200': { description: Level, content: { application/json: { schema: { $ref: '#/components/schemas/Level' } } } }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: Change a level (pm.orgLevel update). Fields sent replace the stored ones; `code` is fixed.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LevelInput' } } } }
      responses:
        '200': { description: Stored level, content: { application/json: { schema: { $ref: '#/components/schemas/Level' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'STALE: version differs from the stored one; nothing written', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      summary: Soft-delete a level (pm.orgLevel delete); its code stays taken. Built-in levels (group, region, wilayah, company, unit) answer 409.
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /pm/masters/unit-types:
    get:
      summary: List unit types, by code (pm.unitType read)
      responses:
        '200': { description: Unit types, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UnitType' } } } } }
    post:
      summary: Add a unit type (pm.unitType create); the code is generated (MJU001, …)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UnitTypeInput' } } } }
      responses:
        '201': { description: Stored unit type, content: { application/json: { schema: { $ref: '#/components/schemas/UnitType' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { description: 'NO_PREFIX: no active row in pm.code_prefix for unit_type', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /pm/masters/unit-types/upload:
    post:
      summary: CSV import (pm.unitType upload); not available yet
      responses: { '501': { $ref: '#/components/responses/Error' } }
  /pm/masters/unit-types/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string }, description: Any case }
    get:
      summary: One unit type
      responses:
        '200': { description: Unit type, content: { application/json: { schema: { $ref: '#/components/schemas/UnitType' } } } }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: Change a unit type (pm.unitType update). Fields sent replace the stored ones; `code` is fixed.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UnitTypeInput' } } } }
      responses:
        '200': { description: Stored unit type, content: { application/json: { schema: { $ref: '#/components/schemas/UnitType' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'STALE: version differs from the stored one; nothing written', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      summary: Soft-delete a unit type (pm.unitType delete); its code stays taken. 409 while units use it.
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /pm/masters/org-units:
    get:
      summary: List organization units, by code (pm.orgUnit read)
      responses:
        '200': { description: Units, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OrgUnit' } } } } }
    post:
      summary: Add a unit (pm.orgUnit create); the code is generated (MUO001, …)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitInput' } } } }
      responses:
        '201': { description: Stored unit, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnit' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { description: 'NO_PREFIX: no active row in pm.code_prefix for org_unit', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /pm/masters/org-units/upload:
    post:
      summary: CSV import (pm.orgUnit upload); not available yet
      responses: { '501': { $ref: '#/components/responses/Error' } }
  /pm/masters/org-units/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string }, description: Any case }
    get:
      summary: One unit
      responses:
        '200': { description: Unit, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnit' } } } }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: Change a unit (pm.orgUnit update); also moves it (parentCode) or changes its level or type. `code` is fixed.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitInput' } } } }
      responses:
        '200': { description: Stored unit, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnit' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'STALE: version differs from the stored one; nothing written', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      summary: Soft-delete a unit (pm.orgUnit delete); its code stays taken. 409 while units hang under it.
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /pm/masters/grades:
    get: { summary: 'List Grade Jabatan (pm.grade read)', responses: { '200': { description: Records, standard fields first } } }
    post:
      summary: 'Add (pm.grade create); code generated. Body: standard fields and rank (1.., unique among live)'
      responses: { '201': { description: Stored }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Validation' } }
  /pm/masters/grades/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string }, description: Any case }
    get: { summary: One record, responses: { '200': { description: Record }, '404': { $ref: '#/components/responses/Error' } } }
    put: { summary: 'Change; fields sent replace the stored ones (version: 409 STALE)', responses: { '200': { description: Stored }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { summary: 'Soft delete; 409 IN_USE while used', responses: { '204': { description: Deleted }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } }
  /pm/masters/jabatan:
    get: { summary: 'List Jabatan (pm.jabatan read)', responses: { '200': { description: Records, standard fields first } } }
    post:
      summary: 'Add (pm.jabatan create); code generated. Body: standard fields and gradeCode, kind (struktural|fungsional), levelCode'
      responses: { '201': { description: Stored }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Validation' } }
  /pm/masters/jabatan/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string }, description: Any case }
    get: { summary: One record, responses: { '200': { description: Record }, '404': { $ref: '#/components/responses/Error' } } }
    put: { summary: 'Change; fields sent replace the stored ones (version: 409 STALE)', responses: { '200': { description: Stored }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { summary: 'Soft delete; 409 IN_USE while used', responses: { '204': { description: Deleted }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } }
  /pm/masters/positions:
    get: { summary: 'List Posisi (pm.position read)', responses: { '200': { description: Records, standard fields first } } }
    post:
      summary: 'Add (pm.position create); code generated. Body: standard fields and unitCode, jabatanCode (fixed after create), reportsToCode, head, holderEmployeeCode, actingEmployeeCode, name optional (made from jabatan · unit)'
      responses: { '201': { description: Stored }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Validation' } }
  /pm/masters/positions/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string }, description: Any case }
    get: { summary: One record, responses: { '200': { description: Record }, '404': { $ref: '#/components/responses/Error' } } }
    put: { summary: 'Change; fields sent replace the stored ones (version: 409 STALE)', responses: { '200': { description: Stored }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { summary: 'Soft delete; 409 IN_USE while used', responses: { '204': { description: Deleted }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } }
  /pm/masters/approval-rules:
    get: { summary: 'List Aturan Approval (pm.approvalRule read)', responses: { '200': { description: Records, standard fields first } } }
    post:
      summary: 'Add (pm.approvalRule create); code generated. Body: standard fields and sop, module, minSteps, reach {kind: steps|level|amount, steps, level, bands [{max, level}]}; problems as reach.kind, reach.steps, reach.level, reach.bands'
      responses: { '201': { description: Stored }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Validation' } }
  /pm/masters/approval-rules/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string }, description: Any case }
    get: { summary: One record, responses: { '200': { description: Record }, '404': { $ref: '#/components/responses/Error' } } }
    put: { summary: 'Change; fields sent replace the stored ones (version: 409 STALE)', responses: { '200': { description: Stored }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { summary: 'Soft delete; 409 IN_USE while used', responses: { '204': { description: Deleted }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } }
  /pm/masters/delegations:
    get: { summary: 'List Delegasi (pm.delegation read)', responses: { '200': { description: Records, standard fields first } } }
    post:
      summary: 'Add (pm.delegation create); code generated. Body: standard fields and name (the reason), validFrom/validTo (required), positionCode, delegateEmployeeCode (required), ruleCodes (empty = every type)'
      responses: { '201': { description: Stored }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Validation' } }
  /pm/masters/delegations/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string }, description: Any case }
    get: { summary: One record, responses: { '200': { description: Record }, '404': { $ref: '#/components/responses/Error' } } }
    put: { summary: 'Change; fields sent replace the stored ones (version: 409 STALE)', responses: { '200': { description: Stored }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { summary: 'Soft delete; 409 IN_USE while used', responses: { '204': { description: Deleted }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } }
  /pm/masters/custom-flows:
    get: { summary: 'List Approval Custom (pm.approvalFlow read)', responses: { '200': { description: Records, standard fields first } } }
    post:
      summary: 'Add (pm.approvalFlow create); code generated. Body: standard fields and sop, ruleCode, scopeUnitCode, stepCodes (1..20, in order, no repeats)'
      responses: { '201': { description: Stored }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Validation' } }
  /pm/masters/custom-flows/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string }, description: Any case }
    get: { summary: One record, responses: { '200': { description: Record }, '404': { $ref: '#/components/responses/Error' } } }
    put: { summary: 'Change; fields sent replace the stored ones (version: 409 STALE)', responses: { '200': { description: Stored }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { summary: 'Soft delete; 409 IN_USE while used', responses: { '204': { description: Deleted }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } }
  /pm/masters/employees:
    get: { summary: 'List Karyawan (pm.employee read)', responses: { '200': { description: Records, standard fields first } } }
    post:
      summary: 'Add (pm.employee create); code generated. Body: standard fields and name (full name), nik (one live per NIK), joinDate, employmentStatusCode (required), educationLevelCode, workShiftCode, bankCode'
      responses: { '201': { description: Stored }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Validation' } }
  /pm/masters/employees/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string }, description: Any case }
    get: { summary: One record, responses: { '200': { description: Record }, '404': { $ref: '#/components/responses/Error' } } }
    put: { summary: 'Change (version: 409 STALE)', responses: { '200': { description: Stored }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { summary: 'Soft delete; 409 IN_USE while used', responses: { '204': { description: Deleted }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } }
  /pm/masters/employment-status:
    get: { summary: 'List Status Kepegawaian (pm.employmentStatus read)', responses: { '200': { description: Records, standard fields first } } }
    post:
      summary: 'Add (pm.employmentStatus create); code generated. Body: standard fields and permanent, contractMonths (0..120; 0 when permanent)'
      responses: { '201': { description: Stored }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Validation' } }
  /pm/masters/employment-status/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string }, description: Any case }
    get: { summary: One record, responses: { '200': { description: Record }, '404': { $ref: '#/components/responses/Error' } } }
    put: { summary: 'Change (version: 409 STALE)', responses: { '200': { description: Stored }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { summary: 'Soft delete; 409 IN_USE while used', responses: { '204': { description: Deleted }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } }
  /pm/masters/education-levels:
    get: { summary: 'List Jenjang Pendidikan (pm.education read)', responses: { '200': { description: Records, standard fields first } } }
    post:
      summary: 'Add (pm.education create); code generated. Body: standard fields and rank (unique among live)'
      responses: { '201': { description: Stored }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Validation' } }
  /pm/masters/education-levels/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string }, description: Any case }
    get: { summary: One record, responses: { '200': { description: Record }, '404': { $ref: '#/components/responses/Error' } } }
    put: { summary: 'Change (version: 409 STALE)', responses: { '200': { description: Stored }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { summary: 'Soft delete; 409 IN_USE while used', responses: { '204': { description: Deleted }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } }
  /pm/masters/work-shifts:
    get: { summary: 'List Shift Kerja (pm.workShift read)', responses: { '200': { description: Records, standard fields first } } }
    post:
      summary: 'Add (pm.workShift create); code generated. Body: standard fields and start, end (HH:MM), night (required when end is not after start)'
      responses: { '201': { description: Stored }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Validation' } }
  /pm/masters/work-shifts/{code}:
    parameters:
