    get: { summary: 'List Bank (pm.bank read)', responses: { '200': { description: Records, standard fields first } } }
    post:
      summary: 'Add (pm.bank create); code generated. Body: standard fields and clearing (3–7 digits)'
      responses: { '201': { description: Stored }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Validation' } }
  /pm/masters/banks/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string }, description: Any case }
    get: { summary: One record, responses: { '200': { description: Record }, '404': { $ref: '#/components/responses/Error' } } }
    put: { summary: 'Change (version: 409 STALE)', responses: { '200': { description: Stored }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { summary: 'Soft delete; 409 IN_USE while used', responses: { '204': { description: Deleted }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } }
components:
  schemas:
    OrgUnitInput:
      type: object
      description: >
        Standard fields, then the unit's own; relations by code (any case). `code` is generated on create (MUO001, …)
        and fixed; workflow fields are ignored. Rules: the parent is a unit on the level just above (none at the
        top); unitTypeCode is required at the Unit Operasional level and refused elsewhere; a new level, parent or
        type must be active; the level cannot change while units hang under the unit.
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: [string, 'null'], maxLength: 500 }
        active: { type: boolean, default: true }
        validFrom: { type: [string, 'null'], format: date }
        validTo: { type: [string, 'null'], format: date }
        levelCode: { type: string, maxLength: 40 }
        parentCode: { type: [string, 'null'], maxLength: 40 }
        unitTypeCode: { type: [string, 'null'], maxLength: 40 }
        location: { type: [string, 'null'], maxLength: 80 }
        version: { type: integer, minimum: 1, description: 'PUT only, optional (409 STALE when it differs)' }
    OrgUnit:
      type: object
      description: The standard fields (as Level, without rank), then the unit's own; every relation by id and code.
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: 'Generated (MUO001, …); sample units keep their codes' }
        name: { type: string }
        description: { type: [string, 'null'] }
        active: { type: boolean }
        state: { type: [string, 'null'] }
        status: { type: [string, 'null'] }
        remark: { type: [string, 'null'] }
        approvalLevelRequired: { type: [integer, 'null'] }
        approvedAt: { type: [string, 'null'], format: date-time }
        approvedBy: { type: [string, 'null'], format: uuid }
        validFrom: { type: [string, 'null'], format: date }
        validTo: { type: [string, 'null'], format: date }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, format: uuid }
        updatedAt: { type: [string, 'null'], format: date-time }
        updatedBy: { type: [string, 'null'], format: uuid }
        version: { type: integer }
        levelId: { type: string, format: uuid }
        levelCode: { type: string }
        parentId: { type: [string, 'null'], format: uuid }
        parentCode: { type: [string, 'null'] }
        unitTypeId: { type: [string, 'null'], format: uuid }
        unitTypeCode: { type: [string, 'null'] }
        location: { type: [string, 'null'] }
    UnitTypeInput:
      type: object
      description: >
        Standard fields only. `code` is generated on create (MJU001, …) and fixed; workflow fields and the head job
        title (headJabatan, headJabatanId) are ignored until the Jabatan master is served here.
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: [string, 'null'], maxLength: 500 }
        active: { type: boolean, default: true }
        validFrom: { type: [string, 'null'], format: date }
        validTo: { type: [string, 'null'], format: date, description: 'Inclusive; not before validFrom' }
        version: { type: integer, minimum: 1, description: 'PUT only, optional: the version the change was read at (409 STALE when it differs)' }
    UnitType:
      type: object
      description: The standard fields (as Level, without rank) and the head job title.
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: 'Generated (MJU001, …); the seeded types keep EST, PKS, PLS, BLK, KTR' }
        name: { type: string }
        description: { type: [string, 'null'] }
        active: { type: boolean }
        state: { type: [string, 'null'] }
        status: { type: [string, 'null'] }
        remark: { type: [string, 'null'] }
        approvalLevelRequired: { type: [integer, 'null'] }
        approvedAt: { type: [string, 'null'], format: date-time }
        approvedBy: { type: [string, 'null'], format: uuid }
        validFrom: { type: [string, 'null'], format: date }
        validTo: { type: [string, 'null'], format: date }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, format: uuid }
        updatedAt: { type: [string, 'null'], format: date-time }
        updatedBy: { type: [string, 'null'], format: uuid }
        version: { type: integer }
        headJabatanId: { type: [string, 'null'], format: uuid }
        headJabatanCode: { type: [string, 'null'], description: 'Head job title (Jabatan)' }
    LevelInput:
      type: object
      description: >
        Standard fields first, then the page's own. `code` is ignored: the service generates it on create
        (pm.code_prefix, e.g. ML001) and it never changes. Workflow fields are ignored (set by the approval flow).
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: [string, 'null'], maxLength: 500 }
        active: { type: boolean, default: true }
        validFrom: { type: [string, 'null'], format: date }
        validTo: { type: [string, 'null'], format: date, description: 'Inclusive; not before validFrom' }
        rank: { description: 'Whole number 1..2147483647; 1 = top; one live level per rank. A numeric string is accepted.', oneOf: [{ type: integer }, { type: string }] }
        version: { type: integer, minimum: 1, description: 'PUT only, optional: the version the change was read at (409 STALE when it differs)' }
    Level:
      type: object
      description: Instants are RFC 3339 in UTC; user ids are UUIDs.
      properties:
        id: { type: string, format: uuid, description: UUIDv7 }
        code: { type: string, description: 'Generated (ML001, …); the built-in levels keep group, region, wilayah, company, unit' }
        name: { type: string }
        description: { type: [string, 'null'] }
        active: { type: boolean }
        state: { type: [string, 'null'], description: Where the record is in its approval }
        status: { type: [string, 'null'], description: 'Outcome: approved, void, cancelled, posted, …' }
        remark: { type: [string, 'null'] }
        approvalLevelRequired: { type: [integer, 'null'] }
        approvedAt: { type: [string, 'null'], format: date-time }
        approvedBy: { type: [string, 'null'], format: uuid }
        validFrom: { type: [string, 'null'], format: date }
        validTo: { type: [string, 'null'], format: date }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, format: uuid }
        updatedAt: { type: [string, 'null'], format: date-time }
        updatedBy: { type: [string, 'null'], format: uuid }
        version: { type: integer, description: Raised on every change }
        rank: { type: integer }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [VALIDATION, BAD_REQUEST, TOO_LARGE, NOT_FOUND, METHOD_NOT_ALLOWED, FORBIDDEN, IN_USE, STALE, CONFLICT, NO_IMPORT, NO_PREFIX] }
        message: { type: string, description: Indonesian, shown to the user as is }
        details: {}
  responses:
    Error:
      description: Refused
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Validation:
      description: 'Form problems: details.problems = [{field, message}]'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
